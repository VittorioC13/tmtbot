<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - TMT Daily Brief</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> 
</head>
<body>
    <div class="cancel-container">
        <div class="cancel-icon">❌</div>
        <h1 class="cancel-title">Payment Cancelled</h1>
        <p class="cancel-message">
            Your payment was cancelled. You can try again anytime from your dashboard.
        </p>
        <div>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('dashboard') }}" class="btn">Go to Dashboard</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="btn">Login to Dashboard</a>
            {% endif %}
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>
</body>
</html>
