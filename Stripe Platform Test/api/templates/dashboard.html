<!-- templates/dashboard.html -->
{% extends "layout.html" %}
{% block title %}用户中心{% endblock %}

{% block content %}
<h2>欢迎，{{ user.username }}</h2>


{% if user.is_paid %}
  <p class="text-success">✅ 你已完成支付</p>
{% else %}
  <p class="text-danger">❌ 你尚未支付</p>
  <button id="checkout-button" class="btn btn-primary">去支付</button>
{% endif %}

<a class="btn btn-secondary mt-3 me-2" href="{{ url_for('home') }}">🏠 回到首页</a>
<a class="btn btn-link mt-3" href="{{ url_for('logout') }}">退出登录</a>

<!-- Stripe Script 和 JS 支付逻辑 -->
{% if not user.is_paid %}
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const stripe = Stripe("pk_test_51Ri9SyFSHePhJarRxjfJFyYM4GDKoBbkEzXnXxi9NLkgA4TCWGHnq0ZlxGZ04Wwz0cNdCQWmAYxSdQGHCRHjr3Ze00Lc6YYG1o");

    document.getElementById("checkout-button").addEventListener("click", () => {
      fetch("{{ url_for('create_checkout_session') }}", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "X-Requested-With": "XMLHttpRequest"
        }
      })
      .then(res => res.json())
      .then(data => {
        if (data.id) {
          stripe.redirectToCheckout({ sessionId: data.id });
        } else {
          alert("创建支付会话失败");
        }
      })
      .catch(error => {
        console.error("发生错误：", error);
        alert("无法创建支付会话");
      });
    });
  </script>
{% endif %}

{% endblock %}
