<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission - TMT BOT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap');
        body {
            font-family: 'Merriweather', serif;
        }
        .breathing-space {
            letter-spacing: 0.1em;
            line-height: 1.8;
        }
    </style>
</head>
<body class="bg-white min-h-screen">
    <!-- Navigation -->
    <nav class="absolute top-0 left-0 right-0 z-10 p-8">
        <div class="flex justify-between items-center">
            <a href="/" class="text-2xl font-light text-gray-600 hover:text-gray-800 transition-colors duration-300">
                TMT BOT
            </a>
            <a href="/" class="text-sm text-gray-500 hover:text-gray-700 transition-colors duration-300">
                ← Back
            </a>
        </div>
    </nav>

    <!-- Mission Content -->
    <main class="flex items-center justify-center min-h-screen px-8">
        <div class="max-w-2xl mx-auto text-center">
            <!-- Mission Statements -->
            <div class="space-y-12 mb-16">
                <div class="breathing-space text-2xl text-gray-600 leading-relaxed">
                    our mission is to bring clear thinkers in finance.
                </div>
                
                <div class="breathing-space text-2xl text-gray-600 leading-relaxed">
                    we see a path to 0% noise and 100% signal.
                </div>
            </div>

            <!-- Subtle Action -->
            <div class="opacity-60">
                <a href="/" class="inline-block px-8 py-3 text-sm text-gray-500 border border-gray-300 rounded-full hover:border-gray-400 hover:text-gray-600 transition-all duration-300">
                    Return to TMT BOT
                </a>
            </div>
        </div>
    </main>

    <!-- Subtle Background Element -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-1/2 -right-1/2 w-full h-full bg-gradient-to-br from-gray-50 to-transparent opacity-30"></div>
    </div>
</body>
</html>
