<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TMT Daily Brief - {{ date }} - Technology, Media & Telecommunications</title>
  
</head>
<body>
    {% for msg in history %}
        <p><strong>{{ msg.role }}:</strong> {{ msg.content }}</p>
    {% endfor %}
    <form method="POST">
        {{ form.hidden_tag() }}
        {{ form.message(size=60, placeholder="Type a message...") }}
        {{ form.submit() }}
    </form>
</body>
</html>
