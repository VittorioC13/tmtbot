<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stripe Checkout 测试</title>
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
  <!-- 顶部导航 -->
  <nav class="navbar navbar-light bg-light justify-content-between px-4">
    <span class="navbar-brand mb-0 h1">支付测试</span>
    <div>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm me-3">
          欢迎，{{ current_user.username }}
        </a>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">退出</a>
      {% else %}
        <a href="{{ url_for('login') }}" class="btn btn-outline-primary btn-sm">登录</a>
      {% endif %}
    </div>
  </nav>

  <!-- 主体内容 -->
  <div class="container mt-5 text-center">
    <h1>测试商品 - $10.00</h1>
    <button id="checkout-button" class="btn btn-primary btn-lg mt-3">去支付</button>
  </div>

  <script>
    const stripe = Stripe("pk_test_51Ri9SyFSHePhJarRxjfJFyYM4GDKoBbkEzXnXxi9NLkgA4TCWGHnq0ZlxGZ04Wwz0cNdCQWmAYxSdQGHCRHjr3Ze00Lc6YYG1o");

    document.getElementById("checkout-button").addEventListener("click", () => {
      fetch("/create-checkout-session", {
        method: "POST"
      })
      .then(res => res.json())
      .then(data => {
        if(data.id){
          console.log("收到 session 返回值：", data);
          stripe.redirectToCheckout({ sessionId: data.id });
        }else if(data.error){
          alert(data.error)
        }
      });
    });
  </script>
</body>
</html>
