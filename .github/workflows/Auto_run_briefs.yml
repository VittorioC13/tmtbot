name: Generate Daily Brief

on:
  schedule:
    - cron: '0 0 * * *'   # every day at 00:00 UTC = 08:00 CST
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: repo   # all steps run inside the cloned repo

jobs:
  run-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo (no submodules)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git fetch --all --tags
          git checkout main || git checkout -B main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('repo/requirements_generator.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements_generator.txt

      - name: Run main.py
        env:
          NEWS_API: ${{ secrets.NEWS_API }}
          OPENAI_API: ${{ secrets.OPENAI_API }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          python Generator/main.py

      - name: Configure Git identity
        run: |
          git config user.name "lingcheng783@gmail.com"
          git config user.email "lingcheng783@gmail.com"

      - name: Commit generated files
        run: |
          git add api/static/assets/briefs/*.pdf 2>/dev/null || true
          git add api/static/assets/raw/*.txt 2>/dev/null || true
          git add api/static/assets/context/*.txt 2>/dev/null || true
          git add api/term_definitions.json 2>/dev/null || true
          git commit -m "Automated report update for $(date +'%Y-%m-%d')" || echo "Nothing to commit"

      - name: Push changes (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # origin already has an authenticated URL from the clone step
          AHEAD=$(git rev-list --count origin/main..HEAD || echo 0)
          if [ "$AHEAD" -gt 0 ]; then
            git push origin HEAD:main
          else
            echo "No new commits to push."
          fi
