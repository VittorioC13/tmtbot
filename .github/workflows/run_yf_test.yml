name: Run Yahoo Finance Test

on:
  workflow_dispatch: {}   # manual trigger

permissions:
  contents: read

concurrency:
  group: run-yahoo-finance-test
  cancel-in-progress: false

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_generator.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_generator.txt
          # yfinance now prefers curl_cffi; this ensures it’s available
          pip install "yfinance[curl]" || true

      - name: Show versions (debug)
        run: |
          python -V
          pip list

      - name: Run yf_test.py
        run: |
          python Generator/yf_test.py
