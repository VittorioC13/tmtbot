name: Generate Weekly Recaps

on:
  schedule:
    - cron: '0 0 * * 0'  # every Sunday at 00:00 UTC = 08:00 China time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-weekly-recap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # we'll push with our own token via CLI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements_generator.txt

      - name: Run weekly recap generator
        env:
          # keep consistent with your existing secrets setup
          OPENAI_API: ${{ secrets.OPENAI_API }}
          NEWS_API: ${{ secrets.NEWS_API }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          # change this path to wherever you placed the uploaded recap script in the repo
          python Generator/weekly_recap.py

      - name: Configure Git identity
        run: |
          git config user.name "lingcheng783@gmail.com"
          git config user.email "lingcheng783@gmail.com"

      - name: Commit generated recap files
        run: |
          # PDFs
          git add api/static/assets/recaps/*.pdf 2>/dev/null || true
          # raw recap text (if you output it)
          git add api/static/assets/recaps_raw/*.txt 2>/dev/null || true

          git commit -m "Automated weekly recaps for week of $(date -u +'%Y-%m-%d')" || echo "Nothing to commit"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push origin HEAD:main
          else
            echo "No new commits to push."
          fi
